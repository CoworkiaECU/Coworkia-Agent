<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 110" width="480" height="110" role="img" aria-label="PropElite Real Estate">
  <defs>
    <linearGradient id="chrome-main" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"  stop-color="#FFFFFF"/>
      <stop offset="20%" stop-color="#E4E4E4"/>
      <stop offset="48%" stop-color="#8C8C8C"/>
      <stop offset="72%" stop-color="#D8D8D8"/>
      <stop offset="100%" stop-color="#ABABAB"/>
    </linearGradient>
    <linearGradient id="chrome-sub" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"  stop-color="#C8C8C8"/>
      <stop offset="100%" stop-color="#787878"/>
    </linearGradient>
  </defs>

  <!-- PropElite serif metallic text -->
  <text
    x="240" y="68"
    text-anchor="middle"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="56"
    font-weight="400"
    fill="url(#chrome-main)"
    letter-spacing="2">PropElite</text>

  <!-- Flanking lines -->
  <line x1="62"  y1="83" x2="158" y2="83" stroke="#888888" stroke-width="0.8"/>
  <line x1="322" y1="83" x2="418" y2="83" stroke="#888888" stroke-width="0.8"/>

  <!-- REAL ESTATE subtitle -->
  <text
    x="240" y="96"
    text-anchor="middle"
    font-family="Arial, Helvetica, sans-serif"
    font-size="11"
    font-weight="300"
    fill="url(#chrome-sub)"
    letter-spacing="5.5">REAL ESTATE</text>
</svg>
